       a:"Anchors are predefined boxes of set sizes and aspect ratios placed at each location; the network predicts offsets from them rather than boxes from scratch, which is an easier regression problem. They hurt silently when their size and shape distribution doesn't match your targets — default configurations are tuned for everyday-object datasets, so unusually small or differently shaped targets may have no well-matching anchor. Recall suffers in a way that looks like a model capacity problem and is actually a configuration problem, and it won't announce itself in the loss.",
       cite:"Elgendy ch. 7.3, pp. 331–341."},
      {q:"Why might non-maximum suppression be a first-order concern for densely packed features?",
       prompt:"",
       a:"NMS discards boxes overlapping a higher-scoring one beyond an IoU threshold, assuming heavy overlap means duplicate detections of one object. When true objects sit close together — junctions in a dense fracture network — genuinely distinct detections can overlap more than the default threshold allows, so NMS deletes real positives. Recall drops for exactly the dense regions that may be most scientifically interesting, and nothing in the training loss reflects it because NMS is unlearned post-processing. The threshold has to be tuned against the actual spacing of your targets.",
       cite:"Elgendy ch. 7.1, pp. 306–313."},
      {q:"Two detectors have the same mAP. What questions do you ask before choosing?",
       prompt:"",
       a:"How performance breaks down by object size, since mAP averages over a size distribution and one detector may be failing entirely on small objects. The precision-recall shape, since equal area can mean high-precision-low-recall versus the reverse, and which you want depends on downstream cost. Behavior at the operating threshold you'd actually deploy, not averaged over all thresholds. Inference speed and memory against the deployment target. And error clustering — whether failures concentrate in an identifiable regime, which is far more dangerous than the same rate spread uniformly.",
       cite:"Elgendy ch. 4.1, pp. 167–170."}
    ]
  },

  /* ---------- VB6 ---------- */
  {
    id:"b6", n:"Session 6", title:"Attention and Transformers",
    blurb:"Self-attention from scratch, and what happened when it reached images.",
    screens:[
      {h:"The problem attention solves", body:[
        "Convolution is local by construction: each output depends on a fixed small neighborhood. Long-range relationships require stacking many layers to grow the receptive field, and even then the connection is indirect.",
        "Attention takes the opposite approach. Every position can look at every other position directly, and the network learns which ones matter for each query.",
        "That's the core idea. The rest is mechanism.",
        ["src","Prince, ch. 12.1–12.2, pp. 221–227. Starmer ch. 11, printed pp. 207–219, is the gentlest version."]
      ]},
      {h:"Query, key, value", body:[
        "Three vectors are computed from each input position, by three learned linear transformations.",
        "The <strong>query</strong> represents what this position is looking for. The <strong>key</strong> represents what each position offers. The <strong>value</strong> is the content a position contributes if attended to.",
        "For a given position, take its query and compare it against every position's key by dot product. Large dot product means a good match. Convert those scores to weights summing to one via softmax. Then output the weighted sum of all values.",
        "So each output position is a blend of all input positions, mixed according to learned relevance. The library metaphor is standard and it works: the query is your request, keys are the spine labels, values are the contents, and you get a blend of the books weighted by how well each spine matched."
      ]},
      {h:"Why multiple heads", body:[
        "One attention operation produces one weighting pattern per position. But a position may need to relate to others in several distinct ways at once.",
        "<strong>Multi-head attention</strong> runs several attention operations in parallel with separate learned projections, then concatenates the results. Each head can specialize in a different relationship.",
        "It's the same reason a convolutional layer has many kernels rather than one.",
        ["src","Prince, ch. 12.3–12.4, pp. 227–230."]
      ]},
      {h:"Position has to be added back", body:[
        "A structural consequence people miss. Attention as described has no notion of order or location: permute the inputs and the outputs permute identically, with no other change.",
        "For images that's a serious problem, since spatial arrangement is most of the information.",
        "So position is injected explicitly, by adding a positional encoding to each input. Sinusoidal patterns at various frequencies in the original formulation, learned position embeddings in most vision work.",
        "This is a real difference from convolution, which encodes locality structurally and can't lose track of it. Attention has to be told where things are.",
        ["aside","Why it matters for your work","Junction classification depends on angular geometry — the arrangement of branches. A model whose spatial understanding comes from a learned positional encoding rather than structural locality may handle that differently than a CNN, for better or worse. It's a real design question rather than a settled one."]
      ]},
      {h:"Vision transformers", body:[
        "Applying this to images required solving one problem: attention costs grow with the square of the number of positions, and treating every pixel as a position is computationally impossible for any real image.",
        "The solution is patches. Cut the image into fixed-size patches, typically 16×16, flatten each into a vector, and treat the sequence of patches as the input. A 224×224 image becomes 196 patches, which is tractable.",
        "The finding that made this significant: with enough training data, vision transformers match or beat convolutional networks, despite having none of the built-in assumptions about locality and translation equivariance that were supposed to be why CNNs worked on images.",
        ["src","Prince, ch. 12.10, <b>Transformers for images</b>, pp. 242–246."]
      ]},
      {h:"The catch about data", body:[
        "That result comes with a condition worth stating precisely, because it's the practically important part.",
        "CNNs have useful assumptions built in. Vision transformers don't, so they must learn from data what a CNN gets for free. With very large datasets that's an advantage, since learned structure can beat imposed structure. With modest datasets it's a disadvantage, and CNNs often still win.",
        "For a domain with limited labeled data — which describes most scientific imaging including yours — that argues for convolutional backbones or for transformers initialized from large-scale pretraining, rather than transformers trained from scratch.",
        "The honest current position is that hybrid architectures and pretrained transformers dominate at scale, while pure CNNs remain entirely reasonable for smaller specialized datasets. Anyone claiming CNNs are obsolete is overstating it."
      ]},
      {h:"Reading note", body:[
        "Prince chapter 12, pp. 221–253, is the clearest written account. Starmer chapters 11 through 14, printed pp. 207–281, build the same material illustrated and step by step, which is worth it if the query-key-value mechanics don't click on first reading.",
        "Note neither Elgendy nor the Grokking first edition covers this at all. It's the gap those books leave."
      ]}
    ],
    questions:[
      {q:"Explain self-attention without equations.",
       prompt:"Ninety seconds.",
       a:"Each position in the input produces three things: a query describing what it's looking for, a key advertising what it offers, and a value holding its content. To compute the output at one position, compare its query against every position's key to get a relevance score, convert those scores into weights that sum to one, and output the weighted blend of all the values. So every position directly gathers information from every other, with the network learning which relationships matter. Unlike convolution, nothing restricts it to a neighborhood.",
       cite:"Prince ch. 12.2, pp. 222–227."},
      {q:"Why do transformers need positional encoding when CNNs don't?",
       prompt:"",
       a:"Attention is permutation equivariant — shuffle the inputs and the outputs shuffle identically with no other change — so the mechanism has no inherent notion of where anything is. For images, where spatial arrangement carries most of the information, that's disqualifying, so position is added explicitly as an encoding on each input, either sinusoidal or learned. Convolution encodes locality structurally through the sliding kernel, so it can't lose track of position. The transformer has to be told, which means its spatial understanding is learned rather than guaranteed.",
       cite:"Prince ch. 12.1 and 12.9, pp. 221–246."},
      {q:"Why do vision transformers use patches instead of pixels?",
       prompt:"",
       a:"Attention compares every position against every other, so cost grows with the square of the sequence length. A 224×224 image has about 50,000 pixels, and the resulting attention matrix is computationally impossible. Splitting into 16×16 patches yields 196 positions, which is tractable. The cost is that fine structure within a patch is compressed into a single embedding at the input, so very small features can be poorly represented — directly relevant when your targets span a handful of pixels.",
       cite:"Prince ch. 12.10, pp. 242–246."},
      {q:"When would you still choose a CNN over a vision transformer?",
       prompt:"",
       a:"When labeled data is limited, which describes most scientific imaging. CNNs have locality and translation equivariance built in; transformers must learn those from data, which is an advantage at very large scale and a liability at modest scale. Also when features are small relative to a sensible patch size, since patch embedding compresses sub-patch detail. And when compute or latency is constrained. The defensible position is that pretrained transformers and hybrids dominate at scale while CNNs remain reasonable for specialized smaller datasets — claiming CNNs are obsolete overstates the evidence.",
       cite:"Prince ch. 12.10, pp. 242–246."}
    ]
  },

  /* ---------- VB7 ---------- */
  {
    id:"b7", n:"Session 7", title:"Generative Models",
    blurb:"GANs, VAEs, and diffusion — what they do and where they're useful to you.",
    screens:[
      {h:"What generative means here", body:[
        "A discriminative model maps an input to a label. A <strong>generative</strong> model learns the distribution of the data itself, well enough to produce new samples from it.",
        "Evaluating them is genuinely harder than evaluating classifiers. There's no correct answer to compare against. A generated image is good if it looks plausible and if the set of generated images covers the variety of the real data, and both properties resist clean measurement.",
        ["src","Prince, ch. 14, <b>Unsupervised learning</b>, pp. 282–288, particularly 14.2 on what makes a good generative model."]
      ]},
      {h:"GANs", body:[
        "Two networks in opposition. A <strong>generator</strong> produces images from random noise. A <strong>discriminator</strong> tries to tell real images from generated ones. Each trains against the other.",
        "The elegance is that the discriminator supplies the training signal. Nobody has to specify what realistic means; the discriminator learns it and the generator learns to defeat it.",
        "The well-known difficulty is instability. Training two networks in competition can oscillate or collapse, most notoriously <strong>mode collapse</strong>, where the generator finds a few outputs that reliably fool the discriminator and produces only those, losing the diversity of the real distribution.",
        ["src","Prince, ch. 15, <b>Generative Adversarial Networks</b>, pp. 289–316; stability at pp. 294–300."]
      ]},
      {h:"Variational autoencoders", body:[
        "A different approach. An <strong>encoder</strong> compresses an image into a low-dimensional latent representation; a <strong>decoder</strong> reconstructs it. The variational part constrains the latent space to a known distribution, so you can sample from it and decode to get new images.",
        "Compared to GANs: training is far more stable, and the latent space is structured in a way that supports interpolation and manipulation. The cost is that outputs are typically blurrier, because the reconstruction objective rewards hedging between plausible options rather than committing to one.",
        ["src","Prince, ch. 17, <b>Variational autoencoders</b>, pp. 340–361."]
      ]},
      {h:"Diffusion models", body:[
        "The approach behind current image generation systems, and the idea is unusual enough to be worth stating carefully.",
        "Training has two directions. The <strong>forward process</strong> takes a real image and adds a small amount of noise, repeatedly, until nothing remains but noise. That direction requires no learning; it's just adding noise on a schedule.",
        "The <strong>reverse process</strong> is what gets learned: a network trained to remove a small amount of noise, given a noisy image and the noise level.",
        "To generate, start from pure noise and apply the learned denoising step repeatedly. Each step removes a little noise, and after many steps an image emerges.",
        "Why it beats GANs: the objective is a stable supervised regression, since you know exactly what noise you added, so there's no adversarial instability and no mode collapse. The cost is that generation requires many sequential network evaluations rather than one.",
        ["src","Prince, ch. 18, <b>Diffusion models</b>, pp. 362–386. Forward process pp. 363–369, reverse pp. 369–370."]
      ]},
      {h:"Where this is useful to you", body:[
        "It's fair to ask why a detection researcher should care, and there are real answers beyond currency.",
        "<strong>Augmentation.</strong> Generative models can synthesize additional training examples, though with an important caveat: a model trained on your data and then used to augment it adds no new information about the world, and can amplify existing biases. Its value is mostly in balancing rare classes.",
        "<strong>Anomaly detection.</strong> A generative model of normal appearance flags what it reconstructs badly. Useful for finding unusual terrain without labels.",
        "<strong>Learned priors.</strong> Diffusion models have become strong priors for inverse problems — denoising, super-resolution, inpainting — which is directly applicable to degraded or partially occluded imagery.",
        "<strong>Understanding the field.</strong> Diffusion is where a large share of current vision research sits. Not following it means gradually losing the ability to read the literature."
      ]},
      {h:"Reading note", body:[
        "Prince chapters 14, 15, 17, and 18. Chapter 16 on normalizing flows is skippable unless you want completeness.",
        "Elgendy chapter 8 covers GANs, pp. 362–394, from the applied side and predates diffusion entirely."
      ]}
    ],
    questions:[
      {q:"Why is evaluating a generative model harder than evaluating a classifier?",
       prompt:"",
       a:"There's no ground-truth output to compare against — a generated image isn't right or wrong, it's plausible or not. Quality has at least two dimensions that trade off: sample fidelity, whether individual outputs look real, and coverage, whether the generated distribution spans the variety of the real one. A model producing a few flawless images has excellent fidelity and terrible coverage, which mode collapse exemplifies. Proxy metrics like FID exist but summarize both properties into one number and are known to be manipulable.",
       cite:"Prince ch. 14.2–14.3, pp. 283–287."},
      {q:"What is mode collapse and why does the GAN objective invite it?",
       prompt:"",
       a:"Mode collapse is the generator producing only a narrow subset of outputs — a few images that reliably fool the discriminator — losing the diversity of the real distribution. The objective invites it because the generator is rewarded solely for fooling the discriminator, not for covering the data distribution. If a handful of outputs work, producing only those is an optimal strategy under that objective. The adversarial dynamic makes it worse: the two networks can chase each other in cycles rather than converging.",
       cite:"Prince ch. 15.2, pp. 294–300."},
      {q:"Explain how a diffusion model generates an image.",
       prompt:"",
       a:"Training uses a forward process that repeatedly adds small amounts of noise to real images until only noise remains — this requires no learning, since the noise schedule is chosen. The network is trained on the reverse: given a noisy image and its noise level, predict the noise to remove. Because you know exactly what you added, this is stable supervised regression rather than an adversarial game. Generation starts from pure noise and applies the learned denoising step many times, with an image gradually emerging. The tradeoff is many sequential network evaluations per sample.",
       cite:"Prince ch. 18.1–18.3, pp. 362–370."},
      {q:"Why does diffusion avoid the problems that made GANs hard to train?",
       prompt:"",
       a:"The training objective is a standard supervised regression with a known target — the noise that was actually added — so there's no second network to compete with and no adversarial dynamic to destabilize. That removes both oscillation and mode collapse, since the model is trained to reverse the noising of every training image rather than to satisfy a moving critic. The cost is inference: sampling requires many sequential denoising steps, making generation far slower than a GAN's single forward pass, which is why much recent work targets step reduction.",
       cite:"Prince ch. 18, pp. 362–386."},
      {q:"Would you use a generative model to augment a small labeled dataset? Argue carefully.",
       prompt:"",
       a:"Cautiously and for a specific purpose. A generator trained on your data adds no new information about the world — it can only recombine what's already there, and it will faithfully reproduce existing biases, potentially amplifying them by making a skewed distribution look richer than it is. Its legitimate uses are balancing rare classes so they aren't swamped in training, and stress-testing a model against controlled variation. What it cannot do is substitute for collecting genuinely new data, and reporting performance gains from synthetic augmentation without validating on real held-out data is a way to fool yourself.",
       cite:"Prince ch. 14, pp. 282–288."}
    ]
  }
  ]
}
];

/* ============================================================
   STATE
   ============================================================ */
const S = { view:"home", course:0, session:0, screen:0, qi:0, revealed:false, results:[] };
let progress = {};

const KEY = "groundwork:progress:v1";
function loadProgress(){
  try{ progress = JSON.parse(localStorage.getItem(KEY)) || {}; }
  catch(e){ progress = {}; }
}
function saveProgress(){
  try{ localStorage.setItem(KEY, JSON.stringify(progress)); }
  catch(e){ /* private browsing or storage full — progress is a convenience */ }
}
function exportProgress(){
  return btoa(unescape(encodeURIComponent(JSON.stringify(progress))));
}
function importProgress(code){
  try{
    const incoming = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(typeof incoming !== "object" || incoming === null) return false;
    Object.assign(progress, incoming);
    saveProgress();
    return true;
  }catch(e){ return false; }
}

const app = document.getElementById("app");
const bar = document.getElementById("bar");
const esc = s => s;

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  window.scrollTo(0,0);
  if(S.view==="home") return renderHome();
  if(S.view==="course") return renderCourse();
  if(S.view==="read") return renderRead();
  if(S.view==="quiz") return renderQuiz();
  if(S.view==="score") return renderScore();
  if(S.view==="transfer") return renderTransfer();
}

function renderTransfer(){
  app.innerHTML = `<div class="mast fade"><h1>Transfer progress</h1>
      <p>Safari and the home-screen app keep separate storage. Move progress between them here.</p></div>
    <div class="eyebrow">Copy from this device</div>
    <textarea id="out" readonly style="width:100%;height:96px;background:var(--surface);
      color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;
      font-family:var(--mono);font-size:12px;resize:none">${exportProgress()}</textarea>
    <div class="eyebrow">Paste into this device</div>
    <textarea id="in" placeholder="Paste a code here" style="width:100%;height:96px;
      background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;
      padding:12px;font-family:var(--mono);font-size:12px;resize:none"></textarea>
    <p class="hint" id="msg">Pasting merges into what's already here. Nothing is overwritten.</p>`;
  bar.innerHTML = `<div class="inner">
    <button class="btn ghost" id="back">Back</button>
    <button class="btn" id="apply">Apply code</button></div>`;
  document.getElementById("out").onclick = e => e.target.select();
  document.getElementById("back").onclick = ()=>{ S.view="home"; render(); };
  document.getElementById("apply").onclick = ()=>{
    const val = document.getElementById("in").value;
    const msg = document.getElementById("msg");
    if(!val.trim()){ msg.textContent = "Paste a code first."; return; }
    if(importProgress(val)){ S.view="home"; render(); }
    else msg.textContent = "That code didn't read. Copy the whole thing and try again.";
  };
}

function courseDone(c){
  return c.sessions.filter(s=>progress[c.id+":"+s.id]).length;
}
function lockedBy(c){
  if(!c.requires) return null;
  const req = COURSES.find(x=>x.id===c.requires);
  if(!req) return null;
  return courseDone(req) === req.sessions.length ? null : req;
}

function renderHome(){
  const parts = COURSES.map((c,i)=>{
    const total = c.sessions.length;
    const done = courseDone(c);
    const lock = lockedBy(c);
    if(lock){
      const left = lock.sessions.length - courseDone(lock);
      return `<div class="card locked fade">
        <div class="n">Opens after ${lock.title}</div>
        <h3>${c.title}</h3>
        <p>${left} session${left===1?"":"s"} left to unlock this.</p></div>`;
    }
    return `<button class="card fade" data-course="${i}">
      <div class="n">${done} of ${total} sessions</div>
      <h3>${c.title}</h3>
      <p>${c.sub}</p>
      <div class="rail"><i style="width:${total?done/total*100:0}%"></i></div>
    </button>`;
  }).join("");
  app.innerHTML = `<div class="mast fade">
      <h1>Groundwork</h1>
      <p>Read on your phone. Write code at a desk.</p>
    </div>
    <div class="eyebrow">Courses</div>${parts}
    <p class="hint">Exercises are marked but deliberately not doable here.<br>
      <button id="xfer" style="color:var(--mint);text-decoration:underline;
        font-family:var(--display);font-size:13px;margin-top:12px">Transfer progress</button></p>`;
  bar.innerHTML = "";
  app.querySelectorAll("[data-course]").forEach(b=>b.onclick=()=>{
    S.course=+b.dataset.course; S.view="course"; render();
  });
  document.getElementById("xfer").onclick=()=>{ S.view="transfer"; render(); };
}

function renderCourse(){
  const c = COURSES[S.course];
  const items = c.sessions.map((s,i)=>{
    const done = progress[c.id+":"+s.id];
    return `<button class="card ${done?"done":""}" data-s="${i}">
      <div class="n">${s.n}${done?" · "+done.score+"/"+done.total:""}</div>
      <h3>${s.title}</h3><p>${s.blurb}</p></button>`;
  }).join("");
  app.innerHTML = `<div class="mast fade"><h1>${c.title}</h1><p>${c.sub}</p></div>
    ${c.note?`<div class="aside fade"><b>Before you start</b>${c.note}</div>`:""}
    <div class="eyebrow">Sessions</div>${items}`;
  bar.innerHTML = `<div class="inner"><button class="btn ghost" id="back">Back</button></div>`;
  document.getElementById("back").onclick=()=>{S.view="home";render();};
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    S.session=+b.dataset.s; S.screen=0; S.view="read"; render();
  });
}

function blockHTML(b){
  if(typeof b === "string") return `<p>${b}</p>`;
  if(b[0]==="code") return `<pre><code>${b[1].replace(/&/g,"&amp;").replace(/</g,"&lt;")}</code></pre>`;
  if(b[0]==="aside") return `<div class="aside"><b>${b[1]}</b>${b[2]}</div>`;
  if(b[0]==="desk") return `<div class="desk"><b>At a desk, not here</b>${b[1]}
    <div class="note">${b[2]||""}</div></div>`;
  if(b[0]==="src") return `<div class="src"><b>Source</b> ${b[1]}</div>`;
  return "";
}

function renderRead(){
  const c = COURSES[S.course], s = c.sessions[S.session], sc = s.screens[S.screen];
  const ticks = s.screens.map((_,i)=>
    `<i class="${i<S.screen?"on":i===S.screen?"now":""}"></i>`).join("");
  app.innerHTML = `<div class="topbar"><button id="x">Close</button><div class="ticks">${ticks}</div></div>
    <div class="screen fade"><h2>${sc.h}</h2>${sc.body.map(blockHTML).join("")}</div>`;
  const last = S.screen === s.screens.length-1;
  bar.innerHTML = `<div class="inner">
    ${S.screen>0?`<button class="btn ghost" id="prev">Back</button>`:""}
    <button class="btn" id="next">${last?"Start questions":"Continue"}</button></div>`;
  document.getElementById("x").onclick=()=>{S.view="course";render();};
  const p=document.getElementById("prev"); if(p) p.onclick=()=>{S.screen--;render();};
  document.getElementById("next").onclick=()=>{
    if(last){ S.qi=0; S.revealed=false; S.results=[]; S.view="quiz"; }
    else S.screen++;
    render();
  };
}

function renderQuiz(){
  const c = COURSES[S.course], s = c.sessions[S.session], q = s.questions[S.qi];
  const ticks = s.questions.map((_,i)=>
    `<i class="${i<S.qi?"on":i===S.qi?"now":""}"></i>`).join("");
  app.innerHTML = `<div class="topbar"><button id="x">Close</button><div class="ticks">${ticks}</div></div>
    <div class="screen fade">
      <div class="qhead">Question ${S.qi+1} of ${s.questions.length}</div>
      <div class="q">${q.q}</div>
      ${q.prompt?`<div class="prompt">${q.prompt}</div>`:""}
      ${S.revealed?`<div class="answer fade"><div class="lbl">A strong answer</div><p>${q.a}</p>
        ${q.cite?`<div class="qcite"><b>Read more</b> ${q.cite}</div>`:""}</div>`:""}
    </div>`;
  bar.innerHTML = S.revealed
    ? `<div class="inner" style="flex-direction:column;gap:8px">
         <div style="font-family:var(--display);font-size:12px;letter-spacing:.14em;
           text-transform:uppercase;color:var(--ink-dim);text-align:center">How did you do?</div>
         <div class="grade">
           <button data-g="0">Missed it</button>
           <button data-g="1">Partly</button>
           <button data-g="2" class="solid">Had it</button>
         </div></div>`
    : `<div class="inner"><button class="btn" id="reveal">Show a strong answer</button></div>`;
  document.getElementById("x").onclick=()=>{S.view="course";render();};
  const r=document.getElementById("reveal");
  if(r) r.onclick=()=>{S.revealed=true;render();};
  bar.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
    S.results.push({q:q.q, g:+b.dataset.g});
    if(S.qi === s.questions.length-1){ S.view="score"; finish(); }
    else { S.qi++; S.revealed=false; }
    render();
  });
}

function finish(){
  const c = COURSES[S.course], s = c.sessions[S.session];
  const score = S.results.filter(r=>r.g===2).length;
  progress[c.id+":"+s.id] = {score, total:s.questions.length, at:Date.now()};
  saveProgress();
}

function renderScore(){
  const c = COURSES[S.course], s = c.sessions[S.session];
  const score = S.results.filter(r=>r.g===2).length;
  const weak = S.results.filter(r=>r.g<2);
  app.innerHTML = `<div class="score fade">
      <div class="big">${score}/${S.results.length}</div>
      <div class="cap">${s.n} · ${s.title}</div>
    </div>
    ${weak.length?`<div class="missed fade"><h4>Worth another pass</h4><ul>
      ${weak.map(w=>`<li>${w.q}</li>`).join("")}</ul></div>`:
      `<p class="hint">Clean sweep. Do the desk exercise before moving on — recall and production are different skills.</p>`}`;
  bar.innerHTML = `<div class="inner">
    <button class="btn ghost" id="again">Retry</button>
    <button class="btn" id="done">Back to sessions</button></div>`;
  document.getElementById("again").onclick=()=>{
    S.qi=0;S.revealed=false;S.results=[];S.view="quiz";render();};
  document.getElementById("done").onclick=()=>{S.view="course";render();};
}

loadProgress();
render();
</script>

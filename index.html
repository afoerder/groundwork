<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C1B20">
<title>Groundwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#0C1B20;
  --surface:#12262D;
  --surface-2:#183138;
  --line:#26454E;
  --ink:#E9E4D9;
  --ink-dim:#9BAEB2;
  --mint:#79D6BC;
  --gold:#DBB166;
  --rose:#D98A8A;
  --display:'Space Grotesk',system-ui,sans-serif;
  --body:'Source Serif 4',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.62;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior-y:none}
#app{max-width:660px;margin:0 auto;padding:0 20px 132px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);
  padding:.12em .34em;border-radius:4px;color:var(--mint);word-break:break-word}
pre{font-family:var(--mono);font-size:13.5px;line-height:1.6;background:var(--surface);
  border:1px solid var(--line);border-left:2px solid var(--mint);border-radius:8px;
  padding:14px 16px;overflow-x:auto;margin:20px 0;-webkit-overflow-scrolling:touch}
pre code{background:none;padding:0;color:var(--ink)}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:4px}

/* ---------- masthead ---------- */
.mast{padding:34px 0 20px}
.mast h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em;
  margin:0 0 6px}
.mast p{margin:0;color:var(--ink-dim);font-size:15px}

/* ---------- course + session cards ---------- */
.eyebrow{font-family:var(--display);font-size:11px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mint);margin:34px 0 12px}
.card{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;
  transition:border-color .18s,transform .12s}
.card:active{transform:scale(.988)}
.card .n{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
.card h3{font-family:var(--display);font-weight:500;font-size:17px;margin:5px 0 4px;
  letter-spacing:-.01em}
.card p{margin:0;font-size:14px;color:var(--ink-dim);line-height:1.5}
.card.done{border-color:var(--mint)}
.card.done .n{color:var(--mint)}
.card.locked{opacity:.42}

/* progress rail */
.rail{height:3px;background:var(--surface-2);border-radius:2px;margin-top:12px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--mint);border-radius:2px;
  transition:width .4s cubic-bezier(.4,0,.2,1)}

/* ---------- reading screen ---------- */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(var(--ground) 74%,transparent);
  padding:14px 0 12px;display:flex;align-items:center;gap:14px}
.topbar button{font-family:var(--display);font-size:14px;color:var(--ink-dim)}
.ticks{flex:1;display:flex;gap:3px}
.ticks i{flex:1;height:3px;background:var(--surface-2);border-radius:2px}
.ticks i.on{background:var(--mint)}
.ticks i.now{background:var(--gold)}

.screen h2{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.25;
  letter-spacing:-.02em;margin:18px 0 16px}
.screen p{margin:0 0 17px}
.screen ul{margin:0 0 18px;padding-left:20px}
.screen li{margin-bottom:8px}
.screen strong{color:var(--gold);font-weight:600}

.aside{border-left:2px solid var(--rose);background:rgba(217,138,138,.07);
  padding:14px 16px;border-radius:0 8px 8px 0;margin:22px 0;font-size:15.5px}
.aside b{font-family:var(--display);display:block;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--rose);margin-bottom:7px;font-weight:500}

/* ---------- source citations ---------- */
.src{font-family:var(--display);font-size:12.5px;color:var(--ink-dim);
  border-left:2px solid var(--gold);padding:8px 0 8px 12px;margin:20px 0;line-height:1.5}
.src b{color:var(--gold);font-weight:500}
.qcite{font-family:var(--display);font-size:12px;color:var(--ink-dim);margin-top:18px;
  padding-top:14px;border-top:1px solid var(--line)}
.qcite b{color:var(--gold);font-weight:500}

/* ---------- desk work ---------- */
.desk{border:1px dashed var(--line);border-radius:12px;padding:18px;margin:24px 0;
  background:var(--surface)}
.desk b{font-family:var(--display);display:block;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--gold);margin-bottom:10px;font-weight:500}
.desk .note{font-size:13.5px;color:var(--ink-dim);font-style:italic;margin-top:14px}

/* ---------- interview ---------- */
.qhead{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin:0 0 14px}
.q{font-family:var(--display);font-size:20px;font-weight:500;line-height:1.4;
  letter-spacing:-.01em;margin:0 0 20px}
.prompt{font-size:14px;color:var(--ink-dim);margin-bottom:22px;font-style:italic}
.answer{border-top:1px solid var(--line);padding-top:20px;margin-top:4px}
.answer .lbl{font-family:var(--display);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mint);margin-bottom:12px}
.grade{display:flex;gap:8px;margin-top:26px}
.grade button{flex:1;border:1px solid var(--line);border-radius:9px;padding:13px 8px;
  font-family:var(--display);font-size:13px;background:var(--surface)}
.grade button.solid{background:var(--mint);color:var(--ground);border-color:var(--mint);font-weight:500}

/* ---------- bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:linear-gradient(transparent,var(--ground) 26%);
  padding:22px 20px calc(20px + env(safe-area-inset-bottom))}
.bar .inner{max-width:660px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;background:var(--mint);color:var(--ground);border-radius:11px;padding:15px;
  font-family:var(--display);font-weight:500;font-size:15px;text-align:center}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink);flex:0 0 78px}
.btn:active{opacity:.85}

/* ---------- scorecard ---------- */
.score{text-align:center;padding:44px 0 10px}
.score .big{font-family:var(--display);font-size:56px;font-weight:700;letter-spacing:-.03em;
  color:var(--mint);line-height:1}
.score .cap{color:var(--ink-dim);font-size:14px;margin-top:8px}
.missed{margin-top:34px}
.missed h4{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rose);margin:0 0 12px;font-weight:500}
.missed li{font-size:15px;margin-bottom:9px;color:var(--ink-dim)}

.fade{animation:fade .34s ease}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hint{color:var(--ink-dim);font-size:13px;text-align:center;margin:26px 0 0}
</style>
</head>
<body>
<div id="app"></div>
<div class="bar" id="bar"></div>

<script>
/* ============================================================
   CURRICULUM DATA
   Add a new course by pushing another object onto COURSES.
   Screens: {h, body[]} where body entries are
     "text"  |  ["code", "..."]  |  ["aside", title, text]  |  ["desk", text, note]
   ============================================================ */

const COURSES = [
{
  id:"fluent-python",
  title:"Fluent Python",
  sub:"Block 1 — The Object Model",
  sessions:[

  /* ============ SESSION 1 ============ */
  {
    id:"s1", n:"Session 1", title:"The Python Data Model",
    blurb:"Types as rulebooks, dunder methods, and why a set can break silently.",
    screens:[
      {h:"Everything is a thing with a label", body:[
        "When you write <code>x = 5</code>, Python creates something in memory holding the value 5. Along with the value it stores a label saying what kind of thing it is. That label says <code>int</code>.",
        "Same with <code>name = \"Mars\"</code>. Something holds those characters and the label says <code>str</code>.",
        "That label has a name. It's the object's <strong>type</strong>. Every value in Python has one. Numbers, text, lists, functions, the things you build yourself. Nothing floats around untyped.",
        ["code","type(5)          # <class 'int'>\ntype(\"Mars\")     # <class 'str'>\ntype([1, 2, 3])  # <class 'list'>"],
        "Hold onto that word. It's about to do all the work."
      ]},
      {h:"A type is a rulebook", body:[
        "The type isn't just a name tag. It's a rulebook saying what this thing can do.",
        "The <code>int</code> rulebook says you can add me, subtract me, multiply me. The <code>str</code> rulebook says you can glue me to another string, ask how long I am, loop over my characters.",
        "Different rulebook, different abilities. That's why <code>\"cat\" + \"dog\"</code> gives <code>\"catdog\"</code> while <code>5 + 3</code> gives <code>8</code>. Same plus sign on the page. Two different rulebooks consulted."
      ]},
      {h:"What len() actually does", body:[
        ["code","len([1, 2, 3])   # 3"],
        "What did Python do?",
        "The obvious guess: <code>len</code> is a built-in ability, Python ships knowing how to measure lists. Under that guess, if you built your own kind of thing, <code>len</code> wouldn't work on it.",
        "That guess is wrong, and how it's wrong is the point of the session.",
        "What actually happens: <code>len</code> looks at the object, goes to its rulebook, and looks for an entry with a specific name. That name is <code>__len__</code>, two underscores each side. If it's there, <code>len</code> runs it. If not, error.",
        "That's the whole mechanism. <strong>len knows nothing about lists.</strong> It only knows to go looking for <code>__len__</code>."
      ]},
      {h:"The underscores", body:[
        "Those double underscores are there for a plain reason. Python needed names it could reserve for itself, names that would never collide with something you'd pick. Nobody accidentally names their own function <code>__len__</code>.",
        "People say these out loud as \"dunder,\" short for double underscore. <code>__len__</code> is \"dunder len.\" It's just slang for the underscores."
      ]},
      {h:"This is not one special case", body:[
        "Once you see it for <code>len</code>, you find it everywhere. Nearly every piece of Python syntax is a disguise over one of these lookups.",
        "<ul><li><code>a + b</code> → looks for <code>__add__</code></li><li><code>x[0]</code> → looks for <code>__getitem__</code></li><li><code>for i in x</code> → looks for <code>__iter__</code></li><li><code>print(x)</code> → looks for <code>__str__</code></li><li><code>with x:</code> → looks for <code>__enter__</code> and <code>__exit__</code></li></ul>",
        "The plus signs and brackets are surface decoration. Underneath, all of it is Python going to the rulebook and looking up a name."
      ]},
      {h:"Why the design matters", body:[
        "Most languages have a privileged inner circle. The language ships knowing its own built-in kinds of things, and those get the nice syntax. Things you build sit outside. You can't make <code>len()</code> work on your creation, so you write <code>myThing.getSize()</code>, every programmer picks a different name, nothing composes.",
        "Python has no inner circle. A thing you define is a sequence in exactly the same way a list is, if it has the same rulebook entries. Python never checks whether something is \"really\" a list. It checks whether the entry it wants is present.",
        "So you are not extending Python when you write these methods. <strong>You are filling in a form Python already knew how to read.</strong>"
      ]},
      {h:"Duck typing", body:[
        "You'll hear that Python is \"duck typed.\" The phrase comes from an old saying: if it walks like a duck and quacks like a duck, call it a duck. Nobody checks its birth certificate.",
        "Applied here: Python doesn't ask what your object is. It asks whether the thing it needs is there. If your object has <code>__len__</code>, <code>len()</code> works on it. Whether it's \"really\" a sequence is a question Python never asks, because there's nothing to ask. Having the entries is what being a sequence means."
      ]},
      {h:"Writing your own rulebook", body:[
        "To define your own kind of thing you write a <strong>class</strong>. A class is how you write a new rulebook.",
        ["code","class Junction:\n    def __init__(self, x, y, kind):\n        self.x = x\n        self.y = y\n        self.kind = kind"],
        "<code>__init__</code> is another reserved name. It runs when someone makes a new <code>Junction</code>, and its job is to store the starting values. <code>self</code> refers to the particular junction being built.",
        "Now <code>j = Junction(412, 1908, \"Y\")</code> works. You've defined a new type with one rulebook entry. Everything else is missing, and the rest of the session is what goes wrong because of that."
      ]},
      {h:"Problem one: it prints as garbage", body:[
        "<code>print(j)</code> gives you something like <code>&lt;__main__.Junction object at 0x7f8b2c0d1f40&gt;</code>. That hex number is a memory address. It tells you nothing.",
        "<code>print</code> went looking for an entry describing how to display this thing, found nothing, and fell back to the least useful possible answer. The entry it wanted is <code>__repr__</code>.",
        ["code","def __repr__(self):\n    return f\"Junction(x={self.x}, y={self.y}, kind={self.kind!r})\""],
        "Write <code>__repr__</code> so it looks like the code you'd type to recreate the object. Someone reading a log sees exactly what they have.",
        ["aside","The cousin","There's also <code>__str__</code>, meant for text shown to a user rather than a programmer. If you write only one, write <code>__repr__</code> — Python falls back to it when <code>__str__</code> is missing. It doesn't work the other way. A class with only <code>__str__</code> still shows the useless hex address in the debugger, which is exactly where you needed it."]
      ]},
      {h:"Problem two: identical junctions aren't equal", body:[
        ["code","a = Junction(412, 1908, \"Y\")\nb = Junction(412, 1908, \"Y\")\na == b     # False"],
        "Same numbers, same kind, and Python says they're different.",
        "When Python evaluates <code>a == b</code> it looks for <code>__eq__</code>. Yours doesn't have one. So it falls back to the default, and the default is: equal only if these are literally the same object in memory.",
        "<code>a</code> and <code>b</code> are separate things holding matching values. Not the same object. So, <code>False</code>.",
        ["aside","This is the dangerous part","It doesn't crash. It doesn't warn. Your duplicate-detection code reports zero duplicates forever and looks like it's working."],
        ["code","def __eq__(self, other):\n    return (self.x, self.y, self.kind) == (other.x, other.y, other.kind)"]
      ]},
      {h:"Problem three: the set breaks", body:[
        "A <strong>set</strong> is a collection that refuses duplicates. You'd expect <code>{a, b}</code> to hold one junction now that they're equal. Instead you get an error saying <code>Junction</code> is unhashable.",
        "To explain that you need to know how a set works. It could check each new item against every stored item, but with a hundred thousand junctions that's a hundred thousand comparisons per insert. Sets exist to avoid exactly that.",
        "So they use a trick. Each item is run through a function turning it into a number, called a <strong>hash</strong>. The set uses that number to pick one of many small buckets. To check for a duplicate it computes the hash, goes to that one bucket, and compares against only the few things there. Everything else is skipped without being looked at."
      ]},
      {h:"The contract", body:[
        "The trick rests on one rule. <strong>If two objects are equal, they must produce the same hash.</strong>",
        "If two equal objects hashed differently they'd land in different buckets, the set would never compare them, and it would store both. Duplicates inside a structure whose whole job is preventing duplicates. No error, no warning, just wrong.",
        "Python guards this for you. The moment you write <code>__eq__</code> without <code>__hash__</code>, Python assumes you've changed what equality means and can no longer trust the default hash to match. So it disables hashing entirely and raises that error. It would rather stop you loudly than let the silent version happen.",
        ["code","def __hash__(self):\n    return hash((self.x, self.y, self.kind))"],
        "The parentheses make a tuple. Python already knows how to hash a tuple of simple values, so you borrow that instead of inventing a number scheme. Same fields in equality and in hash means the rule holds."
      ]},
      {h:"Exercise", body:[
        ["desk","Write <code>Junction</code> with all four entries from an empty file. Make <code>a</code> and <code>b</code> with identical values and predict each of these before running: <code>a == b</code>, <code>a is b</code>, <code>len({a, b})</code>, <code>hash(a) == hash(b)</code>.<br><br>Then delete <code>__hash__</code> and read the error properly. Then put it back but build it from only <code>self.x</code> while equality uses all three fields — make two junctions with the same x but different kinds, put them in a set, and watch it be quietly wrong.",
         "At a desk, no assistant. That last experiment is the exact shape of the bug class you're training to catch."]
      ]}
    ],
    questions:[
      {q:"Walk me through what actually happens when Python evaluates len(x).",
       prompt:"Answer out loud, as if in an interview. Aim for 30 seconds.",
       a:"<code>len</code> is not a primitive operation. Python looks at the object, goes to its type, and looks for a method named <code>__len__</code>. If it exists, that method is called and its result returned. If not, you get a <code>TypeError</code>. The consequence is that <code>len</code> has no special knowledge of lists or strings — any object implementing <code>__len__</code> works with it identically. The indirection also lets <code>len()</code> do things a raw method call can't, like produce a better error message or take a fast path for built-in types written in C."},
      {q:"Why does Python make your class unhashable the moment you define __eq__?",
       prompt:"The interviewer is probing whether you know the contract or just the rule.",
       a:"Because hash-based structures rely on a contract: equal objects must have equal hashes. Sets and dicts use the hash to pick a bucket and only compare within that bucket. If you redefine equality but keep the default identity-based hash, two objects that are now equal would hash differently, land in different buckets, never be compared, and both be stored — silently defeating the purpose of the set. Python can't verify your new equality matches the old hash, so it disables hashing rather than let that happen. It fails loudly instead of silently."},
      {q:"What's the difference between __repr__ and __str__, and which would you implement if you could only do one?",
       prompt:"",
       a:"<code>__repr__</code> is for developers — it's what the REPL, a debugger, and printing a container of objects will show, and by convention it should look like the code that would recreate the object. <code>__str__</code> is the user-facing display used by <code>print()</code> and f-strings. Implement <code>__repr__</code>: <code>__str__</code> falls back to it when missing, but not the reverse. A class with only <code>__str__</code> still shows a useless memory address in the debugger, which is exactly the moment you need it."},
      {q:"Predict the output. Junction defines __eq__ over x, y, and kind, but __hash__ over x only. What does len({a, b}) return for a = Junction(5, 1, 'Y') and b = Junction(5, 2, 'T')?",
       prompt:"Commit to a number before revealing.",
       a:"2 — and that's the correct, unsurprising case. Both have x=5 so they hash to the same bucket, but they're not equal, so both are stored. The dangerous case is the reverse: if two objects <em>are</em> equal but hash differently, the set stores both and you get a silent duplicate. The broken-hash class only misbehaves when equality and hash disagree in that direction, which is what makes it hard to notice in testing."},
      {q:"Someone tells you Python is duck typed. Explain what that means mechanically, not philosophically.",
       prompt:"",
       a:"It means the interpreter never checks an object's declared type before using it. When you write <code>for x in thing</code>, Python looks for <code>__iter__</code> on that object's type. It does not check whether the object inherits from a Sequence class or declares an interface. Having the method <em>is</em> the qualification. That's why a class you write can be a sequence, a number, or a context manager in exactly the same sense as a built-in — there's no privileged tier the language treats differently."},
      {q:"You inherit code where a duplicate-detection step reports zero duplicates on a dataset you're confident contains them. Where do you look first?",
       prompt:"This is a debugging question. Say your first three checks.",
       a:"First, whether the record class defines <code>__eq__</code> at all. Without it, equality falls back to identity, so two records with identical field values are never equal and duplicates are structurally invisible. Second, if <code>__eq__</code> exists, whether <code>__hash__</code> is consistent with it — a hash built over fewer or different fields than equality can scatter equal objects across buckets. Third, whether the objects are mutated after insertion into the set or dict, since changing a field that feeds the hash strands the object in the wrong bucket. All three fail silently rather than raising."}
    ]
  },

  /* ============ SESSION 2 ============ */
  {
    id:"s2", n:"Session 2", title:"Sequences",
    blurb:"Mutable versus immutable, slicing, unpacking, comprehensions.",
    screens:[
      {h:"What a sequence is", body:[
        "A <strong>sequence</strong> is anything holding items in a definite order, where you can ask for item number 3 and get a meaningful answer. Lists, tuples, and strings are all sequences.",
        "Order is the defining property. <code>[1, 2, 3]</code> and <code>[3, 2, 1]</code> are different sequences. Later you'll meet sets and dictionaries, which hold things without a meaningful order, and the contrast is what makes sequences worth naming."
      ]},
      {h:"The split that matters", body:[
        "Python's sequences divide into two camps, and this division causes more confusion than anything else in the language.",
        "A <strong>list</strong> can be changed after you make it. The word is <strong>mutable</strong>, from the same root as mutation.",
        ["code","readings = [4.2, 5.1, 3.8]\nreadings[0] = 9.9          # fine\nreadings.append(2.2)       # fine"],
        "A <strong>tuple</strong> cannot. Once built, it's fixed. This is <strong>immutable</strong>.",
        ["code","coords = (412, 1908)\ncoords[0] = 500            # TypeError"],
        "Lists use square brackets, tuples use parentheses. But the brackets aren't the point. The point is whether the thing can change under you."
      ]},
      {h:"Why want the one that can't change", body:[
        "Immutability sounds like a pure restriction. It buys three things.",
        "<strong>It can be a dict key or set member.</strong> Hashing requires the value never change, because if it changed the hash would change and the item would sit in the wrong bucket. So Python only allows hashing for immutable things. A tuple of coordinates can be a key. A list of coordinates cannot.",
        "<strong>Nothing can modify it behind your back.</strong> Hand a list to a function and that function can change it with no hint at the call site. Hand it a tuple and that whole class of surprise disappears. Session 5's entire subject.",
        "<strong>It signals intent.</strong> A tuple says these values belong together as one record. A list says these are many of the same kind of thing and the count may vary."
      ]},
      {h:"Slicing", body:[
        "<strong>Slicing</strong> means taking a piece of a sequence.",
        ["code","row = [10, 11, 12, 13, 14, 15]\nrow[1:4]     # [11, 12, 13]"],
        "Read it as \"from position 1 up to but not including position 4.\"",
        "Two things trip everyone up. Counting starts at zero, so <code>row[1]</code> is the second item. And the end is excluded.",
        "That exclusion looks arbitrary and isn't: <code>row[0:3]</code> and <code>row[3:6]</code> fit together with no gap and no overlap, and the length of <code>row[a:b]</code> is exactly <code>b - a</code>. Once you're cutting a raster into tiles, that property is what keeps you from off-by-one seams.",
        ["code","row[:3]      # [10, 11, 12]\nrow[3:]      # [13, 14, 15]\nrow[::2]     # every other one\nrow[::-1]    # reversed\nrow[-1]      # last item"]
      ]},
      {h:"Unpacking", body:[
        "Pull a group of values into separate names in one line:",
        ["code","point = (412, 1908, \"Y\")\nx, y, kind = point"],
        "Shorter than three index lookups, and it names the values, which is the real benefit. <code>x</code> says more than <code>point[0]</code>.",

       prompt:"Under a minute. This gets asked constantly.",
       a:"Imagine standing on a foggy hillside trying to reach the bottom. You can't see the valley, but you can feel which way the ground slopes under your feet. So you take a small step downhill, then feel again, then step again, and repeat until the ground is flat. Gradient descent does that with error: the height is how wrong the model currently is, the position is the model's settings, and each step nudges the settings in the direction that reduces error fastest. The step size matters — too small and you never arrive, too large and you overshoot the valley entirely."},
      {q:"Why square the errors instead of just adding up the distances?",
       prompt:"",
       a:"Two reasons. Squaring removes the sign, so misses above and below the line both count as bad rather than cancelling. And it penalizes large misses disproportionately, so the fit works harder to avoid being badly wrong anywhere than to be slightly better everywhere. The tradeoff is outlier sensitivity: one extreme point can dominate the total and pull the fit toward it. Absolute error is more robust to that. Squared error also has a smooth derivative everywhere, which historically made it convenient for optimization. The real criterion is whether the penalty shape matches the cost of being wrong in your actual problem."},

  {
    id:"m4", n:"Session 4", title:"Drawing the Boundary",
    blurb:"Perceptrons, logistic classifiers, and what a probability output actually means.",
    screens:[
      {h:"From predicting numbers to predicting categories", body:[
        "Regression drew a line <em>through</em> points to predict a number. Classification draws a line <em>between</em> points to separate categories.",
        "Same geometry, different job. Instead of asking what value goes with this input, you're asking which side of the boundary it falls on.",
        "With two features you're drawing a line on a plane. With three, a plane in space. With hundreds, a hyperplane you can't picture — but the algebra is identical and nothing about the method changes."
      ]},
      {h:"The perceptron", body:[
        "The simplest classifier. It computes a weighted sum of the inputs and outputs one category if the sum is above a threshold, the other if below.",
        "Training is intuitive: show it examples, and each time it gets one wrong, nudge the weights so the boundary moves toward classifying that example correctly. Repeat until the mistakes stop, or until you give up.",
        "The limitation that matters: a perceptron can only produce a straight boundary. If the two classes aren't separable by a straight line, no amount of training fixes it. The algorithm just cycles without converging."
      ]},
      {h:"The problem with hard answers", body:[
        "The perceptron outputs a bare category. Class A. No indication of how sure it is.",
        "That's a real loss. A point sitting far from the boundary and a point sitting right on it get reported identically, even though one is a confident call and the other is nearly a coin flip.",
        "It also makes training awkward. If the output is a hard yes or no, small weight changes often produce no change in the output at all, so there's no gradient to follow, so gradient descent has nothing to work with."
      ]},
      {h:"Logistic classifiers", body:[
        "The fix is to make the output continuous. Instead of a hard threshold, pass the weighted sum through a function that squashes any number into the range 0 to 1.",
        "That function is the <strong>sigmoid</strong>. Large positive inputs come out near 1, large negatives near 0, and inputs near the boundary come out near 0.5.",
        "Now the output carries confidence. And because the function is smooth, small weight changes produce small output changes, which gives gradient descent a slope to follow. That's the deeper reason for the sigmoid, beyond interpretability."
      ]},
      {h:"What that number is and isn't", body:[
        ["aside","A distinction people get wrong constantly","A sigmoid output of 0.9 is not a 90% probability that the answer is class A. It's a score between 0 and 1 that behaves somewhat like a confidence. Whether it corresponds to a real frequency is a separate property called calibration, and models are frequently badly calibrated — modern neural networks are notoriously overconfident."],
        "If a decision depends on the number meaning what it appears to mean, you have to check calibration explicitly by binning predictions and comparing predicted rates against observed rates. Treating raw scores as probabilities is a quiet, common error."
      ]},
      {h:"More than two classes", body:[
        "For several categories at once, the usual approach computes a separate score for each class and then converts the whole set into values summing to 1 using the <strong>softmax</strong> function.",
        "Softmax is the multi-class generalization of the sigmoid. The same calibration caveat applies, and more strongly: the fact that outputs sum to 1 makes them look even more like probabilities than they are.",
        "Your T/Y/X junction classification is exactly this shape — three classes, one softmax output per detection."
      ]},
      {h:"Reading note", body:[
        "Book: chapters 5 and 6, PDF pages 125 to 198.",
        "Skim the perceptron implementation. Read the sigmoid and softmax sections properly, since the plain-language explanation of why a smooth output matters is the part worth having ready."
      ]}
    ],
    questions:[
      {q:"Why replace the perceptron's hard threshold with a sigmoid?",
       prompt:"",
       a:"Two reasons, and the second matters more. The output becomes graded rather than binary, so a point far from the boundary is distinguishable from one sitting on it. More fundamentally, a hard threshold is flat almost everywhere — small weight changes produce no output change, so there's no gradient for optimization to follow. The sigmoid is smooth, so every weight change produces a proportional output change and gradient descent has a slope to descend. Trainability is the deeper motivation; interpretability is the visible benefit."},
      {q:"Your classifier outputs 0.9 for an example. What does that actually mean?",
       prompt:"An interviewer asking this is checking whether you conflate scores with probabilities.",
       a:"It means the model's score, after squashing, is 0.9 — high confidence relative to its own scale. It does not automatically mean there's a 90% chance the label is correct. That interpretation requires calibration, the property that among all examples scored 0.9, roughly 90% actually are that class. Many models, neural networks especially, are poorly calibrated and systematically overconfident. If a downstream decision depends on the number being a real probability, you check by binning predictions and comparing predicted against observed rates, and recalibrate if needed."},
      {q:"What can't a perceptron do?",
       prompt:"",
       a:"It can only produce a linear decision boundary, so any class structure that isn't linearly separable is out of reach regardless of training time — the classic example being XOR. On non-separable data the update rule never converges, it just cycles. It also gives no confidence information, which makes threshold tuning impossible. The historical importance is that these limitations motivated stacking layers with nonlinear activations, which is where neural networks came from."},
      {q:"How does softmax relate to sigmoid?",
       prompt:"",
       a:"Softmax is the multi-class generalization. Sigmoid maps a single score to a value between 0 and 1 for a binary decision. Softmax takes a vector of per-class scores, exponentiates them, and normalizes so the outputs are positive and sum to one. For two classes, softmax reduces to sigmoid. The practical caveat is that summing to one makes the outputs look more probability-like than they are — normalization is not calibration, and a confidently wrong model still produces a tidy set of numbers summing to one."}
    ]
  },

  /* ---------- ML S5 ---------- */
  {
    id:"m5", n:"Session 5", title:"Measuring a Classifier",
    blurb:"Why accuracy lies, and precision, recall, and ROC in plain language.",
    screens:[
      {h:"Accuracy, and why it fails", body:[
        "<strong>Accuracy</strong> is the fraction of predictions that were correct. Obvious, intuitive, and often useless.",
        "Consider a rare condition present in one case out of a thousand. A model that says \"no\" every single time achieves 99.9% accuracy and has never once identified a case. The number is excellent and the model is worthless.",
        "This is the <strong>class imbalance</strong> problem, and it's not an edge case. Fraud, disease, equipment failure, wildfire ignition, and rare geological features are all rare by nature. Accuracy is misleading for exactly the problems people most want to solve."
      ]},
      {h:"Four outcomes, not two", body:[
        "Fixing it starts with noticing that a binary prediction has four possible outcomes, not two.",
        "<strong>True positive</strong> — you said yes and it was yes.<br><strong>True negative</strong> — you said no and it was no.<br><strong>False positive</strong> — you said yes and it was no. A false alarm.<br><strong>False negative</strong> — you said no and it was yes. A miss.",
        "Arranged in a square this is the <strong>confusion matrix</strong>. Accuracy collapses all four into one number and throws away the distinction between the two ways of being wrong.",
        "That distinction is usually the entire point. A false alarm and a miss almost never cost the same thing."
      ]},
      {h:"Precision and recall", body:[
        "<strong>Precision</strong> answers: of everything I flagged, how much was real? Low precision means crying wolf.",
        "<strong>Recall</strong> answers: of everything real, how much did I catch? Low recall means missing cases.",
        "They pull against each other. Flag everything and recall is perfect while precision collapses. Flag only your single most confident case and precision may be perfect while recall is near zero.",
        ["aside","Making it concrete","Wildfire detection from camera feeds: a false positive sends a crew to a dust plume, costing money and eroding trust. A false negative misses a real ignition. Those costs are wildly different, and which you weight is a decision about consequences, not a technical question with a mathematically correct answer."]
      ]},
      {h:"The F1 score, and its catch", body:[
        "<strong>F1</strong> combines precision and recall into a single number using their harmonic mean, which punishes imbalance — you can't score well by maxing one and abandoning the other.",
        "It's convenient for comparing models and it hides the thing that matters. F1 weights precision and recall equally, which is a claim that false alarms and misses cost the same. That claim is almost always false in practice.",
        "If you know the real cost ratio, use a weighted variant or report both numbers separately. Reaching for F1 by default is a way of avoiding the cost question rather than answering it."
      ]},
      {h:"The threshold is a dial", body:[
        "Here's the piece people miss. A classifier producing a score between 0 and 1 doesn't have fixed precision and recall. You choose a cutoff, and the cutoff moves both.",
        "Lower the threshold and you flag more things: recall rises, precision falls. Raise it and the reverse.",
        "So there is no single precision or recall for a model. There's a curve of achievable tradeoffs, and picking a point on it is a decision about consequences that belongs to whoever owns the consequences."
      ]},
      {h:"ROC and AUC", body:[
        "The <strong>ROC curve</strong> plots that entire tradeoff. Sweep the threshold from one extreme to the other and plot true positive rate against false positive rate at each setting.",
        "A model with no skill produces a diagonal line. A better model bows toward the top-left corner, meaning it catches more real cases at any given false-alarm rate.",
        "<strong>AUC</strong> is the area under that curve, condensing it to one number. It has a clean interpretation: the probability that a randomly chosen positive example scores higher than a randomly chosen negative one. Because it's computed across all thresholds, it measures ranking quality independent of where you set the cutoff.",
        ["aside","The catch, again","AUC is computed using false positive <em>rate</em>, which divides by the number of negatives. With severe imbalance that denominator is enormous, so a large absolute number of false alarms barely moves the rate. AUC can look strong while the model is unusable in practice. For rare positives, the precision-recall curve is more honest."]
      ]},
      {h:"Reading note", body:[
        "Book: chapter 7, PDF pages 199 to 226.",
        "This is the highest-value chapter in the book for interviews. Metric questions come up in nearly every applied ML screen, and the ability to explain the precision-recall tradeoff in terms of real consequences rather than formulas is what separates a good answer from a recited one."
      ]}
    ],
    questions:[
      {q:"Why is accuracy a bad metric, and when is it fine?",
       prompt:"",
       a:"It fails under class imbalance. If one class is 99.9% of the data, always predicting that class scores 99.9% while detecting nothing, so the number is high and the model is worthless. It also collapses the two kinds of error together, hiding the distinction between false alarms and misses, which is usually the distinction that matters. Accuracy is fine when classes are roughly balanced and the two error types genuinely carry similar cost — otherwise report per-class recall, precision, or the full confusion matrix."},
      {q:"Explain precision and recall to a stakeholder using their problem, not statistics.",
       prompt:"Pick a domain and answer concretely.",
       a:"For wildfire detection: recall is what fraction of real fires we catch — if it's 80%, one in five real ignitions goes unreported. Precision is what fraction of our alerts are real fires — if it's 50%, half the crews we dispatch find nothing. They trade against each other: we can catch nearly every fire by alerting aggressively, at the cost of many false dispatches, or make almost every alert real by only flagging obvious cases, at the cost of missing subtle early ones. Where we set that dial is your decision, because you own both costs."},
      {q:"What's wrong with reporting F1 by default?",
       prompt:"",
       a:"F1 weights precision and recall equally, which asserts that a false alarm and a miss cost the same. That's rarely true, and using F1 without checking it substitutes a convenient default for the cost question that actually should be asked. It's also a single number summarizing a whole tradeoff curve at one arbitrary threshold. If the cost ratio is known, a weighted F-beta or separately reported precision and recall at an operationally chosen threshold communicates far more."},
      {q:"When does a high AUC mislead you?",
       prompt:"",
       a:"Under severe class imbalance. AUC uses the false positive rate, whose denominator is the total number of negatives, so with millions of negatives even a large absolute count of false alarms barely moves the rate. You can post an impressive AUC while the model produces far more false alarms than true detections at any usable threshold. For rare-positive problems, the precision-recall curve and its area are more informative because precision's denominator is what you actually flagged. AUC also says nothing about calibration or about which threshold to deploy."},
      {q:"How would you choose an operating threshold for a deployed detector?",
       prompt:"",
       a:"Not from the model — from the consequences. I'd get the relative cost of a miss versus a false alarm from whoever bears them, and the volume of cases expected, since a 5% false positive rate means something different across a thousand versus a billion inputs. Then pick the point on the precision-recall curve that minimizes expected cost at that volume, using validation data rather than the test set. I'd also check that performance holds across relevant subgroups, since a threshold tuned on aggregate data can behave badly on a subset that matters."}
    ]
  }
  ]
},

  /* ---------- VA1 ---------- */
  {
    id:"v1", n:"Session 1", title:"What an Image Actually Is",
    blurb:"Photons to pixels, and why the sensor pipeline matters for your models.",
    screens:[
      {h:"Starting further back than usual", body:[
        "Most machine learning treatment of images starts with an array of numbers and proceeds from there. That skips something worth having, because the array is the end of a long physical process and the properties of that process shape what your model can and can't learn.",
        "For orbital imagery this isn't academic. Illumination geometry, sensor response, and compression all leave signatures in your data, and a network is perfectly happy to learn those instead of the thing you care about."
      ]},
      {h:"A pixel is an integral, not a point", body:[
        "The intuitive picture is that a pixel is a sample of the scene at a point. It isn't. A pixel is the total light collected over a small area of the sensor during the exposure, converted to a number.",
        "That distinction matters. Two scenes with different fine structure can produce identical pixel values if the structure averages out the same way. Information below the sampling scale is not degraded, it's absent.",
        "So when a feature in your imagery approaches the pixel scale, no model recovers it. That's a physical limit, not a training problem, and knowing where it sits is part of framing the task honestly."
      ]},
      {h:"Aliasing", body:[
        "Related, and more insidious. When a scene contains detail finer than the sampling rate, that detail doesn't just disappear. It reappears as false structure at a coarser scale.",
        "The visible version is the moiré pattern you see photographing a striped shirt. The invisible version is fine terrain texture producing apparent periodic structure that isn't in the ground.",
        "The standard defense is blurring slightly before downsampling, which removes detail too fine to represent before it can fold back as an artifact. That's why naive image resizing is a real hazard: resizing by dropping pixels, without pre-filtering, manufactures structure.",
        ["aside","Directly relevant to you","Every resize in a preprocessing pipeline is a place where this can happen. If tiles are downsampled to fit a network's input size using a method that skips the pre-filter, the network may be learning aliasing artifacts that correlate with terrain type."],
        ["src","Szeliski, <b>Computer Vision</b> 2e, ch. 2, pp. 59–131 for image formation; the digital camera pipeline at pp. 105–127."]
      ]},
      {h:"Where the numbers come from", body:[
        "Between photons and your array sits a pipeline, and each stage is a chance for something to be introduced that isn't scene content.",
        "Light hits the sensor and produces charge. Charge is read out and digitized, adding read noise. Some cameras apply a color filter array, so most pixels measure one color and the rest is interpolated, which manufactures correlations between neighboring pixels. Then gamma correction reshapes the values nonlinearly. Then compression discards information judged perceptually unimportant.",
        "The last one deserves attention. JPEG compression works on blocks and introduces block-edge artifacts and ringing near sharp transitions. A network trained on compressed imagery can key on compression signatures, and if compression settings differ between your training and deployment sources, that dependence breaks silently."
      ]},
      {h:"Noise is not one thing", body:[
        "Two distinct kinds, and they behave differently.",
        "<strong>Shot noise</strong> comes from the quantum nature of light. Photon arrivals are random, so even a perfectly uniform scene produces varying counts. Its magnitude scales with the square root of the signal, which means dark regions are proportionally noisier than bright ones.",
        "<strong>Read noise</strong> is added by the electronics during readout and is roughly constant regardless of signal.",
        "The consequence for modeling: noise in an image is not uniform across the image. Shadowed terrain is intrinsically noisier than illuminated terrain, so a detector's confidence should arguably differ between them, and a model evaluated only in aggregate can hide poor performance in exactly the low-signal regions where features are hardest."
      ]},
      {h:"Illumination geometry", body:[
        "What a surface looks like depends on where the light is and where the camera is, not only on the surface.",
        "For orbital imagery this is a first-order effect. The same terrain photographed at different solar incidence angles produces different shadow lengths, different apparent relief, and different contrast. A fracture that's obvious under low sun can be nearly invisible under high sun.",
        ["aside","The trap worth naming","If incidence angle correlates with anything else in your dataset — season, latitude, which images got processed when — a model can learn to use illumination as a shortcut. It will appear to detect features while actually detecting lighting conditions, and it will fail on new acquisitions with different geometry."],
        ["src","Szeliski, ch. 2.2, <b>Photometric image formation</b>, pp. 92–105."]
      ]},
      {h:"Reading note", body:[
        "Szeliski chapter 2 is dense and you don't need all of it. Read 2.2 on photometric formation and 2.3 on the digital camera. Skim 2.1 on geometric primitives unless you're doing registration work.",
        "This is the material a deep-learning-first practitioner typically never encounters, and it's where your instincts about data quality come from."
      ]}
    ],
    questions:[
      {q:"Why might a detector trained on one set of orbital images fail on a new acquisition of the same terrain?",
       prompt:"Name at least three mechanisms.",
       a:"Illumination geometry: different solar incidence changes shadow length and apparent relief, so the same feature presents differently. Sensor and processing differences: gain settings, compression level, and resampling method leave signatures a network can key on. Resolution and resampling: if ground sample distance differs, features occupy different pixel counts than the model learned. Noise characteristics: different exposure changes the shot-to-read noise balance, particularly in shadowed regions. Any of these can produce a model that appears to detect a feature while actually keying on acquisition conditions.",
       cite:"Szeliski ch. 2.2–2.3, pp. 92–127."},
      {q:"What is aliasing, and where does it get introduced in a typical ML preprocessing pipeline?",
       prompt:"",
       a:"Aliasing is detail finer than the sampling rate reappearing as false structure at a coarser scale, rather than simply being lost. In a preprocessing pipeline the usual entry point is resizing: downsampling by dropping or naively interpolating pixels, without first low-pass filtering to remove content too fine to represent. The manufactured structure can correlate with terrain type or texture, so a model may learn artifacts of the resize rather than the scene. The fix is blurring appropriately before downsampling, which most well-implemented resize functions do but not all.",
       cite:"Szeliski ch. 3, pp. 133–216; sampling and aliasing in the image processing chapter."},
      {q:"Why is a pixel better thought of as an integral than a sample?",
       prompt:"",
       a:"A pixel records the total light collected over a finite sensor area during a finite exposure, not the scene value at an infinitesimal point. Structure that varies within that area is averaged, so distinct scenes can produce identical values. The practical consequence is a hard information limit: features approaching the pixel scale aren't degraded but absent, and no amount of model capacity recovers them. Knowing where that limit falls for your instrument tells you which detection tasks are physically possible before any modeling question arises.",
       cite:"Szeliski ch. 2.3, <b>The digital camera</b>, pp. 105–127."},
      {q:"Shot noise scales with the square root of signal. What does that imply for evaluating a detector?",
       prompt:"",
       a:"Noise is not uniform across an image — low-signal regions like shadows are proportionally noisier than bright ones, so features there are intrinsically harder to detect. An aggregate performance number averages over both regimes and can conceal systematically poor performance in the dark regions, which are often exactly where certain features are visible or where the scientific interest sits. The response is to stratify evaluation by signal level or illumination condition rather than reporting a single pooled score.",
       cite:"Szeliski ch. 2.3.3 on sensor noise, within pp. 105–127."}
    ]
  },

  /* ---------- VA2 ---------- */
  {
    id:"v2", n:"Session 2", title:"Filtering and Convolution",
    blurb:"What convolution does mechanically, decades before anyone learned the filters.",
    screens:[
      {h:"The operation, before the learning", body:[
        "Convolution is old. It was doing useful work in image processing long before neural networks, and understanding it as an image operation first makes the learned version much less mysterious.",
        "The operation: take a small grid of numbers, call it a <strong>kernel</strong>. Slide it over the image. At each position, multiply each kernel value by the pixel underneath it, add the products, and write the sum to the output.",
        "That's the whole mechanism. Everything about convolutional networks is this operation with the kernel values learned rather than chosen."
      ]},
      {h:"What different kernels do", body:[
        "A kernel of all equal positive values averages the neighborhood. The output is a blurred image, because each pixel becomes the mean of its surroundings.",
        "A kernel with positive values on one side and negative on the other computes a difference across that direction. Where the image is flat the positives and negatives cancel and the output is near zero. Where there's an edge they don't cancel and the output is large.",
        "That's an <strong>edge detector</strong>, and it falls straight out of the arithmetic. No learning involved. A kernel that responds to horizontal edges is one that differences vertically, and vice versa.",
        ["src","Szeliski, ch. 3.2, <b>Linear filtering</b>, pp. 145–157. Worked kernel examples throughout."]
      ]},
      {h:"Why this is the right operation for images", body:[
        "Two properties, and they're the reason convolution beats a fully connected layer on images.",
        "<strong>Locality.</strong> A pixel's meaning depends mostly on its neighbors, not on pixels far across the image. A kernel only looks at a neighborhood, which builds that assumption in.",
        "<strong>Translation equivariance.</strong> The same kernel is applied everywhere, so a feature produces the same response wherever it appears. Shift the input and the output shifts identically. A fully connected layer would have to learn the feature separately at every position.",
        "The cost saving is enormous. A fully connected layer on a modest image needs millions of parameters per layer. A convolutional layer with a small kernel needs a few dozen, reused everywhere.",
        ["src","Prince, <b>Understanding Deep Learning</b>, ch. 10.1, <b>Invariance and equivariance</b>, pp. 175–177."]
      ]},
      {h:"Equivariance is not invariance", body:[
        "A distinction people blur and interviewers probe.",
        "<strong>Equivariance</strong> means the output transforms the same way the input did. Shift the image, the feature map shifts. Convolution is equivariant to translation.",
        "<strong>Invariance</strong> means the output doesn't change at all. Shift the image, the answer stays the same. That's what you want from a classifier: a junction is a Y junction regardless of where in the tile it sits.",
        "Convolution alone gives equivariance. Invariance comes from what you stack on top — pooling, striding, and eventually global aggregation, each discarding a bit of position information until the final answer no longer depends on it.",
        ["aside","Worth being careful here","Convolution is equivariant to translation and to nothing else. It is not rotation equivariant. A kernel that fires on a horizontal edge does not fire on the same edge rotated 45 degrees; the network has to learn separate kernels for each orientation. For junction detection, where orientation varies arbitrarily, that's a real cost paid in capacity and training data."]
      ]},
      {h:"Padding, stride, and output size", body:[
        "Three mechanical details that cause a large share of shape bugs.",
        "<strong>Padding.</strong> A kernel centered on an edge pixel hangs off the image. Either you skip those positions, shrinking the output, or you pad the border with invented values. Zero padding is standard and introduces a mild artifact: the network sees an artificial dark border and can learn to use it.",
        "<strong>Stride.</strong> How far the kernel moves between positions. Stride 1 evaluates every position. Stride 2 skips every other one, halving the output dimensions and downsampling as a side effect.",
        "<strong>Receptive field.</strong> How much of the original image influences one output value. One 3×3 layer sees 3×3. Stack two and each output sees 5×5. Stack many and the receptive field grows, which is how a network built from tiny kernels eventually responds to large structures.",
        ["src","Elgendy, <b>Deep Learning for Vision Systems</b>, ch. 3.3, <b>Basic components of a CNN</b>, pp. 127–142. Prince ch. 10.2–10.4, pp. 177–188."]
      ]},
      {h:"The 3D detail people get wrong", body:[
        "For a color image, or any multi-band input, a kernel is not 2D. It has depth matching the input's channel count, so a 3×3 kernel on a 3-channel image is 3×3×3 and produces a single number per position, not three.",
        "So one kernel produces one output channel regardless of how many input channels there were. To get many output channels you use many kernels, each with full input depth.",
        "This is where tensor shape confusion usually starts, and it's worth being able to compute the parameter count of a conv layer from memory: kernel height times width times input channels, plus one bias, all times the number of output channels.",
        ["src","Elgendy, ch. 3.6, <b>Convolution over color images (3D images)</b>, pp. 149–154."]
      ]},
      {h:"Reading note", body:[
        "Szeliski 3.2 for the classical view, Elgendy 3.3 and 3.6 for the network view, Prince 10.1 to 10.4 for the principled account of why convolution suits images.",
        "Starmer's chapter 6 on CNNs, printed pages 128–140, covers the same ground with the gentlest on-ramp if any of it feels slippery."
      ]}
    ],
    questions:[
      {q:"Explain convolution to someone who has never seen it, without using the word filter.",
       prompt:"",
       a:"Take a small grid of numbers and lay it over one small patch of the image. Multiply each number in the grid by the pixel value underneath it, add all those products together, and write that single number to a new image. Then slide the grid over by one pixel and repeat, covering the whole image. The result is a new image where each value summarizes a small neighborhood of the original, and what it summarizes depends entirely on the numbers in the grid — averaging them blurs, differencing them across a direction finds edges.",
       cite:"Szeliski ch. 3.2, pp. 145–157."},
      {q:"Why is convolution better suited to images than a fully connected layer?",
       prompt:"",
       a:"Two built-in assumptions that happen to be true of images. Locality: a pixel's meaning depends mostly on nearby pixels, and a small kernel encodes that directly rather than having to learn it. Translation equivariance: the same kernel applies at every position, so a feature learned once is detected everywhere, whereas a fully connected layer must learn it separately per location. The parameter cost differs by orders of magnitude — dozens of weights reused across the image versus millions of independent ones — which matters enormously when labeled data is limited.",
       cite:"Prince ch. 10.1, pp. 175–177."},
      {q:"Distinguish equivariance from invariance, and say which one convolution gives you.",
       prompt:"Interviewers use this to separate people who know the terms from people who use them loosely.",
       a:"Equivariance means the output transforms the same way the input did — shift the image and the feature map shifts correspondingly. Invariance means the output doesn't change at all under the transformation. Convolution is equivariant to translation, not invariant. Invariance to position is built up by what follows: pooling, strided downsampling, and eventually global pooling, each discarding location information until the final prediction no longer depends on where the feature sat. Note that convolution gives neither property for rotation.",
       cite:"Prince ch. 10.1, pp. 175–177."},
      {q:"A 3×3 convolution on a 64-channel input producing 128 output channels — how many parameters?",
       prompt:"Compute it before revealing.",
       a:"73,856. Each kernel spans the full input depth, so it holds 3 × 3 × 64 = 576 weights, plus one bias, giving 577 per output channel. With 128 output channels that's 577 × 128 = 73,856. The key structural point is that kernel depth always matches input channels and one kernel yields one output channel, which is the detail most people get wrong when they picture a 3×3 kernel as flat.",
       cite:"Elgendy ch. 3.6, pp. 149–154."},
      {q:"What's the receptive field, and why does it matter for detecting a feature that spans many pixels?",
       prompt:"",
       a:"The receptive field is the region of the original input that influences a single output value. One 3×3 layer sees a 3×3 region; stacking two makes it 5×5, and it grows with depth, faster with striding or pooling. It matters because a unit can only respond to structure that fits inside its receptive field. If the feature of interest spans a larger area than any unit sees, the network cannot represent it as a single entity regardless of training. That constrains architecture depth and downsampling choices given the pixel scale of your target features.",
       cite:"Prince ch. 10.2–10.4, pp. 177–188."},
      {q:"Zero padding introduces an artifact. What is it and when does it matter?",
       prompt:"",
       a:"Padding invents border values, usually zeros, so kernels can be centered on edge pixels. The network sees an artificial dark frame that never occurs in real content, and it can learn to use border position as a cue. It matters most when the object of interest can appear near tile edges, and when tiling a large image into patches, since every patch boundary becomes a synthetic edge that wasn't there in the source. Reflection padding or overlapping tiles with cropped predictions mitigate it.",
       cite:"Elgendy ch. 3.3, pp. 127–142."}
    ]
  },

  /* ---------- VA3 ---------- */
  {
    id:"v3", n:"Session 3", title:"Classical Feature Detection",
    blurb:"Corners, edges, and junctions — the pre-deep-learning approach, and why it still matters.",
    screens:[
      {h:"Why bother with the old way", body:[
        "For twenty years before deep learning, computer vision was largely about hand-designed feature detectors. Understanding them isn't nostalgia. Three reasons it pays.",
        "It tells you what's actually hard about your problem, independent of any model. It gives you strong baselines that are fast and require no labels. And in interviews it distinguishes you from candidates who only know how to call a training loop.",
        "For junction detection specifically, the classical literature is directly relevant, because corner and junction detection is one of the oldest problems in the field."
      ]},
      {h:"What makes a good feature", body:[
        "The classical criteria are worth internalizing because they apply to learned features too.",
        "<strong>Repeatable.</strong> The same physical structure should be detected again in another image of the same scene, under different lighting or viewpoint.",
        "<strong>Distinctive.</strong> The description should differ enough between different structures to tell them apart.",
        "<strong>Local.</strong> Based on a small region, so occlusion elsewhere doesn't destroy it.",
        "<strong>Efficient.</strong> Cheap enough to compute densely.",
        "A learned detector is judged on the same properties. It just discovers rather than encodes them.",
        ["src","Szeliski, ch. 7.1, <b>Points and patches</b>, pp. 445–481."]
      ]},
      {h:"The corner detection insight", body:[
        "This one idea is worth knowing precisely, because it generalizes.",
        "Take a small window and slide it slightly in every direction. Ask how much the content changes.",
        "In a flat region, nothing changes in any direction. Uninformative.",
        "On an edge, sliding along the edge changes nothing, but sliding across it changes a lot. So there's one direction of no change. You can't localize position along the edge.",
        "At a corner, sliding in any direction changes the content. That's what makes corners good landmarks: they're localizable in two dimensions.",
        "The Harris detector formalizes exactly this by examining the local gradient structure and asking whether variation is large in both directions. Two large values means a corner. One large, one small means an edge. Both small means flat.",
        ["src","Szeliski, ch. 7.1.1 on the Harris detector and its variants, within pp. 445–481."]
      ]},
      {h:"Why junctions are harder than corners", body:[
        "Your problem is not quite corner detection, and the difference is worth articulating.",
        "A corner is where two edges meet. A T, Y, or X junction is where three or more edges meet, and the classification depends on <em>how many</em> meet and at <em>what angles</em>.",
        "That makes the task compound. Localize the junction, then count the incident branches, then measure their angular arrangement. A corner detector fires at all of them without distinguishing type, so detection alone doesn't solve it.",
        "It's also why the problem suits learning. Encoding \"three branches at roughly 120 degrees, unless one is faint, unless the fracture is partially buried\" by hand is exactly the kind of rule that resists explicit specification and yields to examples.",
        ["aside","A useful interview move","Being able to explain why your problem resisted the classical approach, in terms of the classical approach's actual mechanics, is far more convincing than saying you used a CNN because CNNs work well."]
      ]},
      {h:"Edges and contours", body:[
        "Edge detection is the other classical thread that bears on fracture networks.",
        "An edge is a location of rapid intensity change, so detecting one means finding large gradients. The complication is scale: gradients are noisy, so you smooth first, and how much you smooth determines which edges survive. Smooth a little and you get every texture boundary plus noise. Smooth a lot and you get only major structures.",
        "The Canny detector is the classical answer, combining smoothing, gradient computation, thinning the response to single-pixel width, and then linking with two thresholds so that weak edges connected to strong ones are kept while isolated weak ones are dropped.",
        "That hysteresis idea, trusting a weak signal when it connects to a confident one, is a genuinely good idea that reappears in modern post-processing.",
        ["src","Szeliski, ch. 7.2, <b>Edges and contours</b>, pp. 481–492; contour tracking pp. 492–503."]
      ]},
      {h:"Scale", body:[

      {h:"Where loss functions come from", body:[
        "Most treatments hand you a loss function and move on. Prince builds them from one principle instead, and it's worth having because it tells you what to do when the standard losses don't fit.",
        "The principle is <strong>maximum likelihood</strong>. Decide what probability distribution the model outputs over possible answers. Then choose parameters that make the observed training data as probable as possible under that distribution.",
        "Everything standard falls out of this. Assume the output is a normal distribution around the prediction and maximizing likelihood gives you squared error. Assume a Bernoulli distribution for a binary outcome and you get binary cross-entropy. Assume a categorical distribution and you get multiclass cross-entropy.",
        ["src","Prince, ch. 5.1, <b>Maximum likelihood</b>, pp. 70–74, and the recipe at pp. 74–75."]
      ]},
      {h:"Why that framing pays", body:[
        "Two practical consequences.",
        "It tells you the standard losses are not arbitrary conventions but consequences of distributional assumptions. Squared error assumes symmetric, constant-variance, normally distributed errors. When your errors aren't like that, squared error is the wrong tool and you now know why.",
        "And it gives you a construction procedure. Faced with an unusual target — a count, an angle, a bounded quantity, a distribution over types — you pick the distribution that fits and derive the loss, instead of guessing among off-the-shelf options.",
        ["aside","Relevant to junction work","Junction orientation is an angle, and angles wrap. A squared error loss on degrees treats 359 and 1 as maximally different when they're two apart. The distributional framing points you at circular distributions and losses built from them rather than leaving you to discover the problem in your residuals."]
      ]},
      {h:"Gradient descent, and why the plain version isn't used", body:[
        "The plain version computes the gradient over the entire training set, takes one step, repeats. Correct, and impractical: one step requires a full pass over the data.",
        "<strong>Stochastic gradient descent</strong> estimates the gradient from a small random batch instead. The estimate is noisy, but you get thousands of steps in the time one exact step would take, and the noise turns out to help.",
        "Why noise helps is worth knowing. A noisy gradient can push the parameters out of a poor local minimum or a saddle point that an exact gradient would sit in. Batch size is therefore a real hyperparameter, not just a memory setting: smaller batches mean noisier gradients and a different optimization trajectory.",
        ["src","Prince, ch. 6.1–6.2, pp. 91–100."]
      ]},
      {h:"Momentum and Adam", body:[
        "Two refinements you use constantly and should be able to explain.",
        "<strong>Momentum</strong> accumulates a running average of recent gradients and steps in that direction rather than the current gradient alone. The effect is a ball rolling downhill: it builds speed along consistently downhill directions and damps oscillation across a narrow valley, which is the classic slow case for plain SGD.",
        "<strong>Adam</strong> adds per-parameter step sizes. It tracks both an average of recent gradients and an average of their squared magnitudes, then scales each parameter's step by the inverse of its typical gradient size. Parameters with consistently small gradients get larger steps and vice versa.",
        "The practical result is that Adam is far less sensitive to the initial learning rate, which is why it's the default. The tradeoff, occasionally raised, is that SGD with momentum sometimes generalizes slightly better on vision tasks despite converging more slowly.",
        ["src","Prince, ch. 6.3, <b>Momentum</b>, pp. 100–102; ch. 6.4, <b>Adam</b>, pp. 102–105."]

        "The mechanism is the chain rule applied systematically. Each layer receives, from the layer above, how much the loss changes with respect to that layer's output. From that it computes two things: how much the loss changes with respect to its own parameters, and how much it changes with respect to its input, which is what it hands to the layer below.",

      {q:"Where does squared error loss come from? Don't just say it measures distance.",
       prompt:"",
       a:"From maximum likelihood under an assumed normal distribution. If you model the output as normally distributed around the prediction with constant variance, then maximizing the probability of the observed data is equivalent to minimizing the sum of squared differences — the exponential in the Gaussian density becomes a sum of squares once you take logs. That's why it's the default and also why it's wrong when the assumption fails: asymmetric errors, heavy tails, bounded or wrapping targets each imply a different distribution and therefore a different loss.",
       cite:"Prince ch. 5.1–5.3, pp. 70–78."},
      {q:"Why is stochastic gradient descent better than exact gradient descent, beyond being faster per step?",
       prompt:"",
       a:"The noise itself helps. An exact gradient at a saddle point or shallow local minimum is near zero, so exact descent stalls there; a noisy estimate from a small batch can push the parameters out. The noise also acts as a mild regularizer, biasing the optimizer toward flatter minima that tend to generalize better. This makes batch size a genuine hyperparameter rather than a memory setting — smaller batches mean noisier gradients and a materially different trajectory, not just a slower one.",
       cite:"Prince ch. 6.2, pp. 97–100."},
      {q:"Explain what Adam does differently from plain SGD.",
       prompt:"",
       a:"Two additions. It keeps a running average of recent gradients, so steps follow accumulated direction rather than the instantaneous gradient, damping oscillation. And it keeps a running average of squared gradient magnitudes per parameter, using it to scale each parameter's step individually — parameters with habitually small gradients get proportionally larger steps. The practical benefit is robustness to the initial learning rate, which is why it's the default. The counterpoint is that SGD with momentum sometimes generalizes slightly better on vision tasks despite slower convergence.",
       cite:"Prince ch. 6.3–6.4, pp. 100–105."},
      {q:"Why is backpropagation efficient? What would the naive alternative cost?",
       prompt:"",
       a:"The naive approach — perturbing each parameter and measuring the loss change — costs one forward pass per parameter, so millions of passes per update. Backpropagation computes all gradients in about the cost of two forward passes by applying the chain rule backward and reusing intermediates: the derivative of the loss with respect to a deep layer's output is computed once and reused for every parameter feeding into it. The efficiency comes entirely from that reuse, not from any approximation — the gradients are exact.",
       cite:"Prince ch. 7.3–7.4, pp. 114–121."},
      {q:"Why does weight initialization matter, and what goes wrong at each extreme?",
       prompt:"",
       a:"It sets the scale of activations and gradients as they propagate through depth. Too small and activations shrink layer by layer until deep layers see negligible signal and receive negligible gradient, so they barely train. Too large and activations grow, pushing units into saturation or causing divergence. Standard schemes scale the initial variance by the number of inputs per layer to keep activation variance roughly constant with depth — He initialization for ReLU networks. It's a large part of why very deep networks were impractical before this was understood.",
       cite:"Prince ch. 7.5, pp. 121–125."}
    ]
  },

      {q:"What are anchor boxes and how can they silently hurt you?",
